name: Deploy VAAP

on:
  push:
    branches: [main]
    paths-ignore:
      - 'terraform/**'
      - '*.md'
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  ECR_API_REPO: vaap-api
  ECR_WORKER_REPO: vaap-worker
  S3_FRONTEND_BUCKET: vaap-frontend-production
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-deploy.txt
          pip install pytest pytest-asyncio pytest-cov aiosqlite httpx respx
      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v --tb=short || true

  deploy-backend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API Lambda image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -f docker/Dockerfile.lambda \
            -t $ECR_REGISTRY/$ECR_API_REPO:${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_API_REPO:latest .
          docker push $ECR_REGISTRY/$ECR_API_REPO --all-tags

      - name: Build and push Worker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -f docker/Dockerfile.worker \
            -t $ECR_REGISTRY/$ECR_WORKER_REPO:${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_WORKER_REPO:latest .
          docker push $ECR_REGISTRY/$ECR_WORKER_REPO --all-tags

      - name: Update Lambda functions
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          for FUNC in vaap-api vaap-sqs-ecs-trigger vaap-light-tasks; do
            aws lambda update-function-code \
              --function-name $FUNC \
              --image-uri $ECR_REGISTRY/$ECR_API_REPO:${{ github.sha }} \
              --no-cli-pager
          done

      - name: Update ECS task definition image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition vaap-worker \
            --query 'taskDefinition' --output json)
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$ECR_REGISTRY/$ECR_WORKER_REPO:${{ github.sha }}" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
          aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --no-cli-pager

  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        run: |
          cd frontend
          npm ci
          NEXT_OUTPUT=export npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync frontend/out/ s3://$S3_FRONTEND_BUCKET/ --delete

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"
